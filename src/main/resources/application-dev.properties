# Development profile for local testing.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/notifications_db}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wely-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI:http://localhost:8080/realms/wely-realm/protocol/openid-connect/certs}

spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER:localhost:9092}

logging.level.com.calendar.notifications=DEBUG

# wely-users run locally; reconciliation also needs DELETED_USERS_READER_SECRET.
app.users-api.url=${USERS_API_URL:http://localhost:8082}
