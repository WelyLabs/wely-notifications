spring.application.name=notifications
server.port=8087

# Production configuration: application.properties is it, application-dev.properties overrides it.
# spring.mongodb.*, not spring.data.mongodb.*: Boot 4 ignores the old connection keys silently.
spring.mongodb.uri=${MONGODB_URI}
# Creates the unique partial index that keeps one open notification per conversation.
spring.data.mongodb.auto-index-creation=true

# Keycloak: keys from the internal Service, issuer checked against the public URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

logging.level.root=INFO
logging.level.com.calendar.notifications=INFO

# Framework-raised errors answer in the same RFC 7807 shape as GlobalErrorHandler's.
spring.webflux.problemdetails.enabled=true

# --- Kafka ----------------------------------------------------------------------
# One shared group: each record makes one notification, whichever pod reads it. A new group starts
# from the latest offset, so a first deployment does not notify the whole history of the topics;
# USER_DELETED alone starts from the earliest, below.
app.consumers.enabled=${NOTIFICATIONS_CONSUMERS_ENABLED:true}
spring.cloud.function.definition=callEvents;messages;eventGroups;eventDates;friendships;userDeleted
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
# The topics have to exist beforehand.
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.default.group=notifications-service-group
spring.cloud.stream.kafka.default.consumer.start-offset=latest

# Topic names come from the environment, so two environments sharing a broker never read each other's.
spring.cloud.stream.bindings.callEvents-in-0.destination=${CALL_EVENTS_TOPIC:CALL_EVENTS}
spring.cloud.stream.bindings.messages-in-0.destination=${MESSAGE_BROADCAST_TOPIC:MESSAGE_BROADCAST}
spring.cloud.stream.bindings.eventGroups-in-0.destination=${EVENT_GROUP_TOPIC:EVENT_GROUP_CHANGED}
spring.cloud.stream.bindings.eventDates-in-0.destination=${EVENT_DATE_FIXED_TOPIC:EVENT_DATE_FIXED}
spring.cloud.stream.bindings.friendships-in-0.destination=${FRIENDSHIP_TOPIC:FRIENDSHIP_CHANGED}
spring.cloud.stream.bindings.userDeleted-in-0.destination=${USER_DELETED_TOPIC:USER_DELETED}
# Overrides the latest default: an account deleted before this binding first joined must still be erased.
spring.cloud.stream.kafka.bindings.userDeleted-in-0.consumer.start-offset=earliest

# The zone notices write dates in: one for every reader, until users have their own.
app.notices.zone=${NOTICES_ZONE:Europe/Paris}

# --- Web Push -------------------------------------------------------------------
# base64url: the public key a 65-byte uncompressed P-256 point, the private one its 32-byte scalar.
# Empty, push is off: notifications are still recorded and streamed.
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:}
app.push.timeout=10s

# --- Live stream ----------------------------------------------------------------
# A comment this often keeps proxies from closing an idle stream.
app.stream.keep-alive=20s

# --- Actuator -------------------------------------------------------------------
# Only health and info are exposed: the other endpoints describe the internals.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# /actuator/health/liveness and /actuator/health/readiness for the Kubernetes probes. Neither includes
# the database or broker: a datastore blip must not pull every pod out at once.
management.endpoint.health.probes.enabled=true
