spring.application.name=notifications
server.port=8087

# Production configuration: application.properties is it, application-dev.properties overrides it.
# spring.mongodb.*, not spring.data.mongodb.*: Boot 4 ignores the old connection keys silently.
spring.mongodb.uri=${MONGODB_URI}
# Creates the unique partial index that keeps one open notification per conversation.
spring.data.mongodb.auto-index-creation=true

# Keycloak: keys from the internal Service, issuer checked against the public URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# The audience the token must be spent on, i.e. this API, named by the audience mapper of
# business-scope (wely-api-<env>). Without it any authentic token of the realm is accepted,
# whichever client asked for it: adding a client would widen this API's surface silently.
# Empty disables the check, so a realm whose tokens carry no aud still works.
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

logging.level.root=INFO
logging.level.com.calendar.notifications=INFO

# --- Kafka ----------------------------------------------------------------------
# One shared group: each record makes one notification, whichever pod reads it. A new group starts
# from the latest offset, so a first deployment does not notify the whole history of the topics;
# USER_DELETED alone starts from the earliest, below.
app.consumers.enabled=${NOTIFICATIONS_CONSUMERS_ENABLED:true}
spring.cloud.function.definition=callEvents;messages;eventGroups;eventDates;friendships;birthdayNotices;friendshipNotices;userDeleted
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
# The topics have to exist beforehand.
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.default.group=notifications-service-group
spring.cloud.stream.kafka.default.consumer.start-offset=latest

# Topic names come from the environment, so two environments sharing a broker never read each other's.
spring.cloud.stream.bindings.callEvents-in-0.destination=${TOPIC_PREFIX}call-events
spring.cloud.stream.bindings.messages-in-0.destination=${TOPIC_PREFIX}message-broadcast
spring.cloud.stream.bindings.eventGroups-in-0.destination=${TOPIC_PREFIX}event-group-changed
spring.cloud.stream.bindings.eventDates-in-0.destination=${TOPIC_PREFIX}event-date-fixed
spring.cloud.stream.bindings.friendships-in-0.destination=${TOPIC_PREFIX}friendship-changed
spring.cloud.stream.bindings.birthdayNotices-in-0.destination=${TOPIC_PREFIX}birthday-notices
spring.cloud.stream.bindings.friendshipNotices-in-0.destination=${TOPIC_PREFIX}friendship-notices
spring.cloud.stream.bindings.userDeleted-in-0.destination=${TOPIC_PREFIX}user-deleted
# Overrides the latest default: an account deleted before this binding first joined must still be erased.
spring.cloud.stream.kafka.bindings.userDeleted-in-0.consumer.start-offset=earliest

# The zone notices write dates in: one for every reader, until users have their own.
app.notices.zone=${NOTICES_ZONE:Europe/Paris}

# --- Account erasure reconciliation ---------------------------------------------
# Pages wely-users' tombstones and erases again whatever USER_DELETED did not finish. Blank URL or
# secret still starts the service: each pass then fails with NTF-TEC-002 and is retried after retry-interval.
app.users-api.url=${USERS_API_URL:}
app.users-api.deleted-users-secret=${DELETED_USERS_READER_SECRET:}
app.account-erasure.reconciliation.enabled=${ACCOUNT_ERASURE_RECONCILIATION_ENABLED:true}
app.account-erasure.reconciliation.initial-delay=1m
app.account-erasure.reconciliation.interval=24h
app.account-erasure.reconciliation.retry-interval=1h
app.account-erasure.reconciliation.recent-window=48h
app.account-erasure.reconciliation.page-size=500

# --- Web Push -------------------------------------------------------------------
# base64url: the public key a 65-byte uncompressed P-256 point, the private one its 32-byte scalar.
# Empty, push is off: notifications are still recorded and streamed.
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:}
app.push.timeout=10s

# --- APNs (native iOS push) -----------------------------------------------------
# Needs a paid Apple Developer account's auth key (.p8). Any of the first three empty, APNs is off.
# The private key is the .p8 content, PKCS#8 PEM, with or without its armor and newlines.
app.push.apns.team-id=${APNS_TEAM_ID:}
app.push.apns.key-id=${APNS_KEY_ID:}
app.push.apns.private-key=${APNS_PRIVATE_KEY:}
app.push.apns.bundle-id=${APNS_BUNDLE_ID:com.welylabs.wely}

# --- Live stream ----------------------------------------------------------------
# A comment this often keeps proxies from closing an idle stream.
app.stream.keep-alive=20s

# --- Actuator -------------------------------------------------------------------
# Health, info and the Prometheus metrics (wely_errors_technical_total among them) are exposed; the other
# endpoints describe the internals. SecurityConfig opens the probes and /actuator/prometheus only.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# /actuator/health/liveness and /actuator/health/readiness for the Kubernetes probes. Neither includes
# the database or broker: a datastore blip must not pull every pod out at once.
management.endpoint.health.probes.enabled=true
# HTTP latency as a handful of fixed buckets for Grafana, not a full percentile histogram: this runs on a Pi.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms,5s
