# Placeholder values so the Spring context can start without external services.
spring.application.name=notifications-test
server.port=0

spring.mongodb.uri=mongodb://localhost:27017/notifications-test
spring.data.mongodb.auto-index-creation=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

spring.cloud.stream.kafka.binder.brokers=localhost:9092

logging.level.root=WARN

# No broker in the unit tests: the consumer tests drive the consumers directly.
app.consumers.enabled=false

app.notices.zone=Europe/Paris
